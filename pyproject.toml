[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "helix-education"
version = "2.1.1"
description = "Event-sourced learning engine with a SQLite core and sealed quiz scoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["education", "event-sourcing", "learning-engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "pydantic>=2.0",
    "ollama>=0.4",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "cryptography>=42.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
helix-learn = "helix_education.cli:main"
helix-web = "helix_education.web_server:main"
helix-web-v2 = "helix_education.web_server_v2:main"
# ASGI entrypoint: bounded worker threads per request and uvicorn workers per
# process. This is the supported serving path (audit P-1).
helix-web-asgi = "helix_education.asgi_app:main"

[project.urls]
Homepage = "https://github.com/Hatemshalaby15071979/Helix-Education"
Repository = "https://github.com/Hatemshalaby15071979/Helix-Education"

[tool.setuptools.packages.find]
# `helix_core` is its own distribution now (packages/helix-core) and is not
# part of this wheel. `helix-core` is a sibling, not a dependency: nothing in
# this package imports it.
include = ["state_core*", "learning_service*", "content_engine*", "quiz_engine*", "progress_engine*", "delivery_engine*", "api_layer*", "helix_education*", "grounding_engine*", "observability*", "cognitive_agent*", "cognitive_engine*", "analytics_engine*"]
exclude = ["packages*", "tests*", "build*", "dist*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",
    "E741",
    "F841",
    "F821",
    "F811",
    "F401",
    "W293",
    "W291",
]

[tool.ruff.lint.isort]
known-first-party = [
    "helix_core",
    "state_core",
    "learning_service",
    "content_engine",
    "quiz_engine",
    "progress_engine",
    "delivery_engine",
    "cognitive_engine",
    "grounding_engine",
    "api_layer",
    "helix_education",
]

[tool.pytest.ini_options]
# The core is its own distribution and runs its own suite from its own
# directory (`cd packages/helix-core && pytest`). Collecting both here breaks:
# two directories named `tests` collide in pytest's module resolution.
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "integration: marks tests that require live network access (skipped by default)",
    "performance: marks performance-oriented tests",
    "security: marks security-oriented tests",
]

# Coverage floor.
#
# The suite had 465 passing tests and no coverage floor, so coverage could
# fall for a long time without anything going red. This is the floor that
# makes the next silent regression loud.
#
# The number was measured before it was set: 53% on Python 3.11, 3.12 and
# 3.13 (the versions CI runs), and 51% on 3.14. The floor is 51, so the
# gate is green by construction on every interpreter measured — including
# the one a developer is most likely to run locally.
#
# It may be raised. It may never be lowered after a result is seen.
[tool.coverage.report]
fail_under = 51
show_missing = true
skip_covered = false
exclude_also = [
    # A `__main__` guard is not a branch worth covering.
    "if __name__ == .__main__.:",
    # Type-only and protocol declarations.
    "@abstractmethod",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.coverage.run]
branch = false
source = [
    "state_core",
    "learning_service",
    "content_engine",
    "quiz_engine",
    "progress_engine",
    "delivery_engine",
    "api_layer",
    "helix_education",
    "grounding_engine",
    "observability",
    "cognitive_agent",
    "cognitive_engine",
    "analytics_engine",
]

[tool.bandit]
exclude_dirs = ["./build", "./dist", "./.venv", "./helix_education.egg-info", "./tests", "./packages/helix-core/tests", "./packages/helix-core/build"]
skips = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pandas>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4"]

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/helix-core
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Compile check (compileall)
        run: python -m compileall -q .

      - name: Tests (pytest)
        run: pytest -q

      - name: Tests (helix-core)
        working-directory: packages/helix-core
        run: pytest -q

  security:
    name: security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        run: python -m pip install --upgrade pip bandit

      - name: Bandit scan (medium and above)
        run: bandit -c pyproject.toml -r . -q -ll

  packages:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build helix-core wheel
        run: python -m build --wheel --outdir dist packages/helix-core

      - name: Build helix-education wheel
        run: python -m build --wheel --outdir dist .

      - name: Verify the two distributions are split
        run: python scripts/verify_distributions.py

      - name: Metadata check (twine)
        run: python -m twine check dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

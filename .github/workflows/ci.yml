name: CI

# WHY THIS FILE EXISTS
#
# The gates that define quality in this repository: the test suite on
# every supported Python version, the coverage floor, the linters, the
# security scan, and the two-distribution build check.
#
# Every branch push, not only main. A workflow limited to `main` cannot
# be exercised on a topic branch at all, so a change is only verifiable
# after it reaches main. Running on every push makes a branch verifiable
# before it lands.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The release-consistency check reads the git tags, and
          # actions/checkout defaults to a shallow clone that has none. A
          # shallow clone makes the check report every released version as
          # untagged — false problems that look like real ones.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/helix-core
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      # The version in the manifests, the CHANGELOG and the git tags must
      # describe the same release.
      - name: Release metadata agrees
        run: python scripts/check_release.py

      # The advisory pass over the rules this repository's ruff configuration
      # deliberately ignores (F401 unused imports, F811 redefinition, F821
      # undefined name, F841 unused variable).
      #
      # It was carried by the two duplicate workflows this file replaces, and
      # it is worth keeping: ruff is configured to ignore these rules, so
      # without this step nothing looks at them. The F821 findings are real
      # undefined names in modules that import their dependencies lazily.
      #
      # Advisory means advisory: it reports and does not fail the build.
      # Turning it into a gate would fail on findings that predate it, which
      # is a separate decision, not a side effect of tidying the workflows.
      - name: Advisory lint (unused and undefined names)
        continue-on-error: true
        run: ruff check --select F401,F811,F821,F841 --output-format concise .

      - name: Compile check (compileall)
        run: python -m compileall -q .

      - name: Tests (pytest)
        run: pytest -q

      - name: Tests (helix-core)
        working-directory: packages/helix-core
        run: pytest -q

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/helix-core
          pip install -e ".[dev]"
          pip install pytest-cov

      # The floor lives in pyproject.toml ([tool.coverage.report]
      # fail_under). This step measures and enforces it.
      #
      # It runs on ONE interpreter rather than the whole matrix: the floor
      # is a single number, and measuring it on three versions would give
      # three numbers and no single thing to compare against. The floor was
      # measured on 3.11, 3.12 and 3.13 before it was set, and set below
      # the lowest of them so it is green by construction.
      - name: Coverage floor
        run: pytest -q --cov --cov-report=term

  # Audit P-5: the perf and stress suites existed but nothing ran them, so a
  # throughput regression was invisible until a user felt it.
  performance:
    name: performance and stress
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/helix-core
          pip install -e ".[dev]"

      # Each test carries its own wall-clock ceiling; see the assertions in
      # tests/test_agent_performance.py.
      - name: Perf and stress suites
        run: pytest -q tests/test_agent_performance.py tests/test_agent_stress.py

      # Serving model (audit P-1): concurrent requests must overlap, and the
      # real handler must answer when served by uvicorn.
      - name: ASGI serving model
        run: pytest -q tests/test_asgi_server.py

  security:
    name: security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bandit
        run: python -m pip install --upgrade pip bandit

      - name: Bandit scan (medium and above)
        run: bandit -c pyproject.toml -r . -q -ll

  packages:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build helix-core wheel
        run: python -m build --wheel --outdir dist packages/helix-core

      - name: Build helix-education wheel
        run: python -m build --wheel --outdir dist .

      - name: Verify the two distributions are split
        run: python scripts/verify_distributions.py

      - name: Metadata check (twine)
        run: python -m twine check dist/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

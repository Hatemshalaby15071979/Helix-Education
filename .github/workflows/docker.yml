name: Container image

# Builds the helix_core image, smoke-tests it against /v1/health, and pushes
# to GHCR on version tags.
#
# PUSHING IS TAG-GATED. A push to `main` builds and smoke-tests the image
# but does NOT publish it. The reason is that an image published from a
# branch push is an image nobody declared as a release: it has a `latest`
# tag that consumers pull, and it is replaced by whatever the next push
# produced. A release is a version tag, so only a version tag publishes.
#
# Pull requests build and smoke-test but never push, as before.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "packages/helix-core/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "packages/helix-core/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  # packages: write is granted per-job below, only to the job that can
  # actually publish, and only when the publish token is present. A
  # workflow-wide grant would give every job in this file — including the
  # ones that merely build and smoke-test — the ability to push an image.
  packages: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase in a repository name, and the GitHub owner is
      # "Hatemshalaby15071979". Lowercase it once, here.
      - name: Resolve image name
        id: meta
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${owner}/helix-core" >> "$GITHUB_OUTPUT"

      - name: Read version from pyproject
        id: ver
        run: |
          version=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $version"

      - name: Build image
        run: |
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.version=${{ steps.ver.outputs.version }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t helix-core:ci .

      - name: Smoke test — start the container and hit /v1/health
        run: |
          set -euo pipefail
          docker run -d --name helix-core-smoke \
            -p 127.0.0.1:18000:8000 \
            -e HELIX_CORE_SECRET=ci-smoke-secret \
            -e HELIX_CORE_TOKEN=ci-smoke-token \
            helix-core:ci

          ok=0
          for i in $(seq 1 40); do
            if body=$(curl -fsS http://127.0.0.1:18000/v1/health 2>/dev/null); then
              echo "health: $body"
              echo "$body" | grep -q '"status":"ok"' && ok=1 && break
            fi
            sleep 1
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::health endpoint never became ready"
            docker logs helix-core-smoke || true
            exit 1
          fi

          # End-to-end: register a quiz, answer it, read the score.
          quiz=$(curl -fsS -X POST http://127.0.0.1:18000/v1/quizzes \
            -H "Authorization: Bearer ci-smoke-token" \
            -H "Content-Type: application/json" \
            -d '{"topic":"ci","items":[{"question":"2+2?","options":["3","4"],"correct_index":1}]}')
          echo "quiz: $quiz"
          quiz_id=$(echo "$quiz" | python3 -c "import json,sys;print(json.load(sys.stdin)['quiz_id'])")
          item_id=$(echo "$quiz" | python3 -c "import json,sys;print(json.load(sys.stdin)['items'][0]['item_id'])")

          answer=$(curl -fsS -X POST "http://127.0.0.1:18000/v1/quizzes/$quiz_id/answers" \
            -H "Authorization: Bearer ci-smoke-token" \
            -H "Content-Type: application/json" \
            -d "{\"item_id\":\"$item_id\",\"selected_index\":1}")
          echo "answer: $answer"
          echo "$answer" | grep -q '"correct":true'

          score=$(curl -fsS "http://127.0.0.1:18000/v1/quizzes/$quiz_id/score" \
            -H "Authorization: Bearer ci-smoke-token")
          echo "score: $score"
          echo "$score" | grep -q '"percentage":100'

          # The registration response must never leak the key.
          if echo "$quiz" | grep -q 'correct_index'; then
            echo "::error::registration response leaked correct_index"
            exit 1
          fi

      - name: Dump container logs on failure
        if: failure()
        run: docker logs helix-core-smoke || true

      - name: Stop smoke container
        if: always()
        run: docker rm -f helix-core-smoke || true

      # Publishing is tag-gated AND credential-gated.
      #
      # Two independent gates, both of which must be open before an image
      # reaches GHCR:
      #
      #   1. The workflow only publishes for a `v*` tag. A branch push
      #      never publishes anything.
      #   2. The publish steps require the GHCR_PUBLISH_TOKEN secret to
      #      be present. Without it the image is still built and
      #      smoke-tested, and nothing is pushed.
      #
      # The second gate exists because the first is not enough on its own:
      # a tag can be pushed by anyone with write access, and an image
      # published from a tag nobody intended to release is still a
      # published image. The token is the deliberate act.
      #
      # Without the token this job exits successfully with a message
      # instead of failing: a repository without a publish token is a
      # normal state, not an error.
      - name: Check that publishing is enabled
        id: publish
        env:
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          if [ -z "$GHCR_PUBLISH_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GHCR_PUBLISH_TOKEN is not set. The image was built and smoke-tested, but nothing was published."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # BOTH gates must be open: a version tag, and the token. The tag
      # condition is not implied by the token check — a token present on a
      # branch push must still not publish.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') && steps.publish.outputs.enabled == 'true'
        run: echo "${{ secrets.GHCR_PUBLISH_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push
        if: startsWith(github.ref, 'refs/tags/v') && steps.publish.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          docker tag helix-core:ci "${{ steps.meta.outputs.image }}:${{ github.sha }}"
          docker tag helix-core:ci "${{ steps.meta.outputs.image }}:${{ steps.ver.outputs.version }}"
          docker tag helix-core:ci "${{ steps.meta.outputs.image }}:latest"
          docker push --all-tags "${{ steps.meta.outputs.image }}"

      - name: Report that nothing was published
        if: steps.publish.outputs.enabled != 'true' || !startsWith(github.ref, 'refs/tags/v')
        run: echo "::notice::No image was pushed. Set the GHCR_PUBLISH_TOKEN secret to enable publishing."

      - name: Summary
        run: |
          {
            echo "### helix_core image"
            echo ""
            echo "- version: \`${{ steps.ver.outputs.version }}\`"
            echo "- commit: \`${{ github.sha }}\`"
            if [ "${{ steps.publish.outputs.enabled }}" = "true" ]; then
              echo "- pushed: \`${{ steps.meta.outputs.image }}:${{ steps.ver.outputs.version }}\`, \`${{ steps.meta.outputs.image }}:${{ github.sha }}\`, \`${{ steps.meta.outputs.image }}:latest\`"
            else
              echo "- pushed: no (publishing is not enabled)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

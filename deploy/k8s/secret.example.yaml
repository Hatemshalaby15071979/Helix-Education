# TEMPLATE ONLY — do not commit real values, and do not apply this file
# as-is. Create the secret from the runbook instead:
#
#   kubectl -n helix-education create secret generic helix-core-secrets \
#     --from-literal=token="$(openssl rand -hex 32)" \
#     --from-literal=sealed-key-secret="$(openssl rand -hex 32)"
#
# `token` is the bearer token every client must present (HELIX_CORE_TOKEN).
# `sealed-key-secret` is the HMAC key that protects the answer keys
# (HELIX_CORE_SECRET). Losing the second one makes every previously sealed
# quiz unscoreable — it is not a password, it is part of the data.
apiVersion: v1
kind: Secret
metadata:
  name: helix-core-secrets
  namespace: helix-education
  labels:
    app.kubernetes.io/name: helix-core
    app.kubernetes.io/part-of: helix-education
type: Opaque
stringData:
  token: "REPLACE_WITH_openssl_rand_hex_32"
  sealed-key-secret: "REPLACE_WITH_openssl_rand_hex_32"

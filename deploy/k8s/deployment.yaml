# helix_core runs as a SINGLE replica, on purpose.
#
# The store is SQLite in WAL mode: one writer, one file. Two pods on the same
# volume is not a scaling knob, it is data corruption. `strategy: Recreate`
# guarantees the old pod is gone before the new one attaches the volume.
#
# Scaling this out means replacing SqliteEventStore with a Postgres-backed
# implementation of the same interface. That is a code change, not a manifest
# change — see deploy/DEPLOYMENT_RUNBOOK.md, "Scaling beyond one replica".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix-core
  namespace: helix-education
  labels:
    app.kubernetes.io/name: helix-core
    app.kubernetes.io/part-of: helix-education
    app.kubernetes.io/version: "2.1.1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app.kubernetes.io/name: helix-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: helix-core
        app.kubernetes.io/part-of: helix-education
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: helix-core
          image: ghcr.io/hatemshalaby15071979/helix-core:2.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: HELIX_CORE_DB
              value: /data/core.db
            - name: HELIX_CORE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: helix-core-secrets
                  key: token
            - name: HELIX_CORE_SECRET
              valueFrom:
                secretKeyRef:
                  name: helix-core-secrets
                  key: sealed-key-secret
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: helix-core-data
        - name: tmp
          emptyDir: {}
